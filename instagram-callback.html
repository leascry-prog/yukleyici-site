<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yukleyici - Instagram</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.6">
<p>Instagram girişi tamamlandı, Yükleyici paneline aktarılıyorsun…</p>
<p>Otomatik açılmazsa: <a id="git" href="http://127.0.0.1:8765/">Paneli aç</a> (Yükleyici bilgisayarında çalışıyor olmalı).</p>
<script>
  // Meta yerel http adresini kabul etmediği için kod bu sayfaya gelir ve aynen yerel panele aktarılır.
  // Kod sadece bu bilgisayardaki panele gider; hiçbir yere kaydedilmez.
  var hedef = "http://127.0.0.1:8765/oauth/instagram/callback" + window.location.search;
  document.getElementById("git").href = hedef;
  window.location.replace(hedef);
</script>
</body>
</html>
